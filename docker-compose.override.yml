---
x-geimser-zammad-build: &geimser-zammad-build
  image: ${GEIMSER_IMAGE_REPO:-itsm-geimser-zammad}:${VERSION:-7.0.1-0048}
  build:
    context: .
    dockerfile: docker/geimser-zammad/Dockerfile
    args:
      VERSION: ${VERSION:-7.0.1-0048}

services:
  zammad-backup:
    <<: *geimser-zammad-build
    platform: ${DOCKER_PLATFORM:-linux/amd64}
  zammad-elasticsearch:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
  zammad-init:
    <<: *geimser-zammad-build
    platform: ${DOCKER_PLATFORM:-linux/amd64}
  zammad-memcached:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
  zammad-nginx:
    <<: *geimser-zammad-build
    platform: ${DOCKER_PLATFORM:-linux/amd64}
  zammad-postgresql:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
  zammad-railsserver:
    <<: *geimser-zammad-build
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    healthcheck:
      start_period: 600s
      retries: 10
  zammad-redis:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
  zammad-scheduler:
    <<: *geimser-zammad-build
    platform: ${DOCKER_PLATFORM:-linux/amd64}
  zammad-websocket:
    <<: *geimser-zammad-build
    platform: ${DOCKER_PLATFORM:-linux/amd64}

  meshcentral:
    image: ghcr.io/ylianst/meshcentral:${MESH_VERSION:-latest}
    restart: ${RESTART:-always}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    environment:
      HOSTNAME: ${MESH_HOSTNAME:-localhost}
      PORT: 443
      ALLOW_NEW_ACCOUNTS: ${MESH_ALLOW_NEW_ACCOUNTS:-false}
      IFRAME: ${MESH_IFRAME:-true}
      WEBRTC: ${MESH_WEBRTC:-false}
      DYNAMIC_CONFIG: "false"
      MINIFY: "true"
    ports:
      - "${MESH_EXPOSE_PORT:-127.0.0.1:8443}:443"
    volumes:
      - meshcentral-data:/opt/meshcentral/meshcentral-data
      - meshcentral-files:/opt/meshcentral/meshcentral-files
      - meshcentral-web:/opt/meshcentral/meshcentral-web
      - meshcentral-backups:/opt/meshcentral/meshcentral-backups

volumes:
  meshcentral-data:
    driver: local
  meshcentral-files:
    driver: local
  meshcentral-web:
    driver: local
  meshcentral-backups:
    driver: local
